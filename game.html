<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合詳細｜野澤の足跡</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;background:#f3f4f6;color:#171717}header{background:#111;color:white;padding:35px 20px;text-align:center}header a{color:#aaa;text-decoration:none;font-size:.85rem}header a:hover{color:white}header h1{margin:15px 0 0;font-size:1.7rem;letter-spacing:.08em}main{max-width:850px;margin:0 auto;padding:35px 16px 70px}.date{text-align:center;color:#777;font-size:.9rem;margin-bottom:15px}.result{background:white;border-radius:14px;padding:30px 20px;text-align:center;box-shadow:0 2px 10px #0000000d}.teams{display:flex;align-items:center;justify-content:center;gap:25px}.team{flex:1;font-size:1.1rem;font-weight:700}.score{font-size:2.5rem;font-weight:900;white-space:nowrap}.vs{color:#aaa;font-size:.8rem;margin:0 5px}.result-label{display:inline-block;margin-top:18px;padding:5px 12px;border-radius:5px;font-size:.75rem;font-weight:800}.win{background:#e3f2e9;color:#176b3a}.lose{background:#fbe5e3;color:#b3261e}.draw{background:#eee;color:#666}.section{margin-top:30px}.section-title{font-size:1.2rem;border-left:5px solid #222;padding-left:10px;margin-bottom:15px}.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 10px #0000000d}.video-button{display:block;padding:13px 18px;background:#222;color:white;text-align:center;text-decoration:none;border-radius:7px;font-size:.9rem;font-weight:600}.memo{line-height:1.9;white-space:pre-wrap}.photo{width:100%;display:block;border-radius:10px}.photo-link{display:block}.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.info-row:last-child{border-bottom:none}.info-label{color:#777}.loading{text-align:center;color:#777;padding:50px 20px}.error{background:white;padding:25px;border-radius:12px;text-align:center;color:#b3261e}.back-button{display:block;margin-top:30px;text-align:center;color:#555;text-decoration:none;font-size:.9rem}footer{border-top:1px solid #ddd;text-align:center;padding:30px 20px;color:#999;font-size:.75rem}.scorebook-scroll{overflow-x:auto}.scorebook-table{border-collapse:collapse;min-width:650px;width:100%;font-size:.85rem}.scorebook-table th,.scorebook-table td{border:1px solid #e4e9e6;padding:10px 8px;text-align:center;vertical-align:top}.scorebook-table th{background:#eaf0ec;white-space:nowrap}.scorebook-table td.name{text-align:left;white-space:nowrap}.scorebook-table .cell-events{display:flex;flex-direction:column;gap:4px}.scorebook-table .cell-event{display:block;white-space:nowrap}.scorebook-table .sub-name{font-size:.78rem;color:#52635c;margin-top:3px}.scorebook-notes{font-size:.82rem;line-height:1.8;color:#555;margin-top:14px}.scorebook-notes ul{padding-left:1.4em;margin:6px 0}.scorebook-status{color:#666;font-size:.9rem;line-height:1.8}@media(max-width:600px){.teams{gap:8px}.team{font-size:.9rem}.score{font-size:2rem}.card{padding:15px}}
</style>
</head>
<body>
<header><a href="index.html">← 野澤の足跡に戻る</a><h1>試合詳細</h1></header>
<main><div id="content"><div class="loading">試合情報を読み込んでいます……</div></div></main>
<footer>© 野澤ナイン</footer>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzq93sES0c32ta5NPsjpp67mS3e6P9Cstxj79VBWy2RjSKYt2rVwNWt8kX7vQF70McU/exec';
const SCOREBOOK_API_URL='https://script.google.com/macros/s/AKfycbxMBKXfzrTkblVDx4r5_arAeChNOjVYPvp1orHideZYf7RKuFh3MZ8mG0wfOV1h3rDk/exec';
const escapeHtml = value => {const el=document.createElement('div');el.textContent=String(value??'');return el.innerHTML;};
const safeUrl = value => {try {const u=new URL(String(value));return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}};
const displayDate = raw => {const d=new Date(raw);if(Number.isNaN(d.getTime()))throw new Error('試合日が不正です');return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};};
const dateKey = raw => {const d=new Date(raw);return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);};
async function loadGame(){
 const content=document.getElementById('content');
 try{
  const response=await fetch(API_URL);if(!response.ok)throw new Error('試合情報の取得失敗');
  const games=await response.json();if(!Array.isArray(games))throw new Error('試合情報の形式が不正');
  const params=new URLSearchParams(location.search),targetDate=params.get('date'),targetOpponent=params.get('opponent'),targetId=params.get('id');
  const game=targetId?games.find(g=>String(g.id||'')===targetId):games.find(g=>dateKey(g.date)===targetDate&&g.opponent===targetOpponent);
  if(!game)throw new Error('試合が見つかりません');
  const {year,month,day}=displayDate(game.date),scoreFor=Number(game.scoreFor),scoreAgainst=Number(game.scoreAgainst);
  const resultClass=scoreFor>scoreAgainst?'win':scoreFor<scoreAgainst?'lose':'draw',resultText=scoreFor>scoreAgainst?'WIN':scoreFor<scoreAgainst?'LOSE':'DRAW';
  const video=safeUrl(game.youtube),photo=safeUrl(game.photo);
  content.innerHTML=`
   <div class="date">${year}年${month}月${day}日</div>
   <div class="result"><div class="teams"><div class="team">野澤ナイン</div><div class="score">${scoreFor}<span class="vs"> - </span>${scoreAgainst}</div><div class="team">${escapeHtml(game.opponent)}</div></div><div class="result-label ${resultClass}">${resultText}</div></div>
   <section class="section"><h2 class="section-title">スコアブック</h2><div class="card" id="scorebook"><p class="scorebook-status">スコアブックを読み込んでいます……</p></div></section>
   ${video?`<section class="section"><h2 class="section-title">試合動画</h2><div class="card"><a class="video-button" href="${escapeHtml(video)}" target="_blank" rel="noopener noreferrer">YouTubeで試合を見る</a></div></section>`:''}
   ${game.memo?`<section class="section"><h2 class="section-title">試合メモ</h2><div class="card"><div class="memo">${escapeHtml(game.memo)}</div></div></section>`:''}
   ${photo?`<section class="section"><h2 class="section-title">試合写真</h2><div class="card"><a class="photo-link" href="${escapeHtml(photo)}" target="_blank" rel="noopener noreferrer"><img class="photo" src="${escapeHtml(photo)}" alt="試合写真" loading="lazy"></a></div></section>`:''}
   <section class="section"><h2 class="section-title">試合情報</h2><div class="card"><div class="info-row"><span class="info-label">試合日</span><span>${year}/${month}/${day}</span></div><div class="info-row"><span class="info-label">対戦相手</span><span>${escapeHtml(game.opponent)}</span></div><div class="info-row"><span class="info-label">試合会場</span><span>${escapeHtml(game.venue||'未登録')}</span></div><div class="info-row"><span class="info-label">得点</span><span>${scoreFor}</span></div><div class="info-row"><span class="info-label">失点</span><span>${scoreAgainst}</span></div></div></section>
   <a class="back-button" href="index.html">← 試合一覧に戻る</a>`;
  if(!/^G\d+$/.test(String(game.id||''))){document.getElementById('scorebook').innerHTML='<p class="scorebook-status">試合IDを取得できません。試合情報APIに id を追加するとスコアブックを表示できます。</p>';return;}
  await loadScorebook(String(game.id));
 }catch(error){console.error(error);content.innerHTML='<div class="error">試合情報を読み込めませんでした。</div>';}
}
async function loadScorebook(gameId){
 const target=document.getElementById('scorebook');
 try{
  const res=await fetch(SCOREBOOK_API_URL+'?gameId='+encodeURIComponent(gameId));if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();if(data.ok!==true||String(data.gameId)!==gameId)throw new Error(data.error||'APIの応答が不正です');
  const names=new Map((data.players||[]).map(p=>[String(p.id),String(p.name)]));
  const starters=(data.starters||[]).slice().sort((a,b)=>Number(a.order)-Number(b.order));
  const pa=(data.plateAppearances||[]).slice().sort((a,b)=>Number(a.sequence)-Number(b.sequence));
  const events=(data.events||[]).slice().sort((a,b)=>Number(a.sequence)-Number(b.sequence));
  if(starters.length===0&&pa.length===0){target.innerHTML='<p class="scorebook-status">スコアブックはまだ登録されていません。</p>';return;}
  const maxInning=Math.max(7,...pa.map(p=>Number(p.inning)||0));
  const innings=Array.from({length:Math.min(15,maxInning)},(_,i)=>i+1);
  const byOrder=new Map();for(let order=1;order<=9;order++)byOrder.set(order,[]);
  for(const p of pa){const order=Number(p.order);if(byOrder.has(order))byOrder.get(order).push(p);}
  const rows=Array.from({length:9},(_,i)=>{
   const order=i+1,starter=starters.find(s=>Number(s.order)===order),items=byOrder.get(order),subEvents=events.filter(e=>Number(e.order)===order);
   const members=[starter?.playerId,...subEvents.map(e=>e.playerId),...items.map(p=>p.playerId)].filter(Boolean);
   const unique=[...new Set(members.map(String))];
   const nameCell=unique.length?unique.map((id,j)=>`<div class="${j?'sub-name':''}">${escapeHtml(names.get(id)||id)}${j?'（途中出場等）':''}</div>`).join(''):'—';
   const cells=innings.map(inning=>{
    const at=items.filter(p=>Number(p.inning)===inning);
    return `<td><div class="cell-events">${at.map(p=>`<span class="cell-event" title="${escapeHtml(names.get(String(p.playerId))||p.playerId)}">${escapeHtml(p.result||'未入力')}${at.length>1?` <small>${escapeHtml(names.get(String(p.playerId))||p.playerId)}</small>`:''}</span>`).join('')}</div></td>`;
   }).join('');
   return `<tr><th scope="row">${order}</th><td class="name">${nameCell}</td>${cells}</tr>`;
  }).join('');
  const subNotes=events.map(e=>`<li>${escapeHtml(e.inning||'?')}回・${escapeHtml(e.order||'?')}番：${escapeHtml(names.get(String(e.previousId))||e.previousId||'不明')} → ${escapeHtml(names.get(String(e.playerId))||e.playerId||'不明')}（${escapeHtml(e.type||'交代')}／${escapeHtml(e.timing||'時点不明')}）</li>`).join('');
  const unknown=pa.filter(p=>!Number.isInteger(Number(p.order))||Number(p.order)<1||Number(p.order)>9).length;
  target.innerHTML=`<div class="scorebook-scroll"><table class="scorebook-table"><thead><tr><th>打順</th><th>選手</th>${innings.map(n=>`<th>${n}回</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div><div class="scorebook-notes">${pa.length?'※ 同じイニングに複数打席がある場合は、同じ欄に順番に表示します。':'※ 打席記録は未登録です。'}${subNotes?`<p>選手交代履歴</p><ul>${subNotes}</ul>`:''}${unknown?`<p>打順が不明な打席記録：${unknown}件</p>`:''}<p>守備位置変更はこの表には反映していません。交代の正確な打席前後関係は、保存済みデータから確定できないため推測していません。</p></div>`;
 }catch(error){console.error(error);target.innerHTML='<p class="scorebook-status">スコアブックを取得できませんでした。公開APIの設定を確認してください。</p>';}
}
loadGame();
</script>
</body>
</html>
