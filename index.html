<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>野澤の足跡｜野澤ナイン</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP",
                   "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 45px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 0.08em;
    }

    header p {
      margin: 12px 0 0;
      color: #ccc;
      font-size: 0.95rem;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 16px 60px;
    }

    .section-title {
      font-size: 1.4rem;
      margin: 0 0 20px;
      border-left: 5px solid #222;
      padding-left: 12px;
    }

    .game {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .date {
      color: #777;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .opponent {
      font-size: 1.15rem;
      font-weight: bold;
    }

    .score {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .win {
      color: #176b3a;
    }

    .lose {
      color: #b3261e;
    }

    .draw {
      color: #666;
    }

    .video-button {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 18px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .video-button:hover {
      opacity: 0.8;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .error {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      color: #b3261e;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>野澤の足跡</h1>
    <p>野澤ナイン 試合記録</p>
  </header>

  <main>

    <section>
      <h2 class="section-title">2026年</h2>

      <div id="games">
        <div class="loading">
          試合記録を読み込んでいます……
        </div>
      </div>
    </section>

  </main>

  <footer>
    © 野澤ナイン
  </footer>

  <script>

    const API_URL = "https://script.google.com/macros/s/AKfycby1bvuObvvdzl6gqAzhlMQpENW7d6ZBWxz0ulKILTctJRZ9rUfZ4WzeS5TWRogfUMDt/exec";

    async function loadGames() {

      const container = document.getElementById("games");

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("データの取得に失敗しました");
        }

        const games = await response.json();

        container.innerHTML = "";

        games.reverse().forEach(game => {

          const date = new Date(game.date);

          const year = date.getFullYear();
          const month = date.getMonth() + 1;
          const day = date.getDate();

          let resultClass = "draw";
          let resultText = "DRAW";

          if (Number(game.scoreFor) > Number(game.scoreAgainst)) {
            resultClass = "win";
            resultText = "WIN";
          }

          if (Number(game.scoreFor) < Number(game.scoreAgainst)) {
            resultClass = "lose";
            resultText = "LOSE";
          }

          const gameElement = document.createElement("div");

          gameElement.className = "game";

          gameElement.innerHTML = `
            <div class="date">
              ${year}年${month}月${day}日
            </div>

            <div class="opponent">
              vs ${escapeHtml(game.opponent)}
            </div>

            <div class="score ${resultClass}">
              ${game.scoreFor} - ${game.scoreAgainst}
              ${resultText}
            </div>

            ${
              game.youtube
              ? `
                <a
                  class="video-button"
                  href="${game.youtube}"
                  target="_blank"
                  rel="noopener noreferrer">
                  試合動画を見る
                </a>
              `
              : ""
            }
          `;

          container.appendChild(gameElement);

        });

      } catch (error) {

        container.innerHTML = `
          <div class="error">
            試合記録を読み込めませんでした。<br>
            Apps Scriptの設定を確認してください。
          </div>
        `;

        console.error(error);
      }
    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    loadGames();

  </script>

</body>
</html>
