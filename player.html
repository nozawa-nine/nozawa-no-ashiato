<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選手別成績｜野澤の足跡</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif;background:#f3f4f6;color:#171717}header{background:#111;color:#fff;text-align:center;padding:30px 16px}header a{color:#bbb;text-decoration:none;font-size:13px}header h1{margin:12px 0 0;font-size:24px}main{max-width:1150px;margin:auto;padding:28px 15px 70px}.card{background:#fff;border-radius:13px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px #0000000d}h2{font-size:18px;margin:0 0 15px;border-left:5px solid #222;padding-left:10px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th,td{border-bottom:1px solid #e1e5e2;padding:10px 9px;text-align:right}th{background:#eaf0ec}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:62px}th:first-child{background:#eaf0ec}tr.total td{font-weight:700;background:#edf4ef;border-top:2px solid #174b3b}tr.total td:first-child{background:#edf4ef}.muted{font-size:12px;color:#666;line-height:1.8}.error{color:#a22}footer{text-align:center;color:#888;font-size:12px;padding:25px}</style></head><body>
<header><a href="stats.html">← 個人成績一覧に戻る</a><h1 id="playerTitle">選手別成績</h1></header>
<main><section class="card"><h2>年度別・通算成績</h2><p class="muted" id="status">読み込み中……</p><p class="muted">年度は1月〜12月。得点※は打席記録上の暫定値。「その他」の打席は集計対象外です。年度の行は新しい順、最下段は通算です。</p></section>
<section class="card"><h2>打撃・走塁成績</h2><div class="scroll"><table id="bat"></table></div></section>
<section class="card" id="pitchSection" hidden><h2>投手成績</h2><p class="muted">防御率は9回換算・7回換算を併記しています。</p><div class="scroll"><table id="pit"></table></div></section></main><footer>© 野澤ナイン</footer>
<script>
const STATS_API_URL='https://script.google.com/macros/s/AKfycbywwCt64Kf-1AsbwuSbkH0Ch04REDeoViQ4C7vWLHPQHQ60QM4L5_2387irVW_sOlLMMQ/exec';
const $=id=>document.getElementById(id);
const fmt=n=>n===null||n===undefined?'---':Number(n).toFixed(3);
const battingCols=[['年度','year'],['打席','PA'],['打数','AB'],['安打','H'],['二塁打','doubles'],['三塁打','triples'],['本塁打','HR'],['打点','RBI'],['得点※','R'],['四球','BB'],['死球','HBP'],['三振','SO'],['犠打','SH'],['犠飛','SF'],['打率','AVG',true],['出塁率','OBP',true],['長打率','SLG',true],['OPS','OPS',true],['盗塁','SB'],['盗塁死','CS'],['盗塁成功率','stealRate',true]];
const pitchingCols=[['年度','year'],['登板','G'],['投球回','IP'],['対戦打者','BF'],['被安打','H'],['被本塁打','HR'],['与四球','BB'],['与死球','HBP'],['奪三振','SO'],['暴投','WP'],['ボーク','BK'],['失点','R'],['自責点','ER'],['防御率(9回)','ERA9',true],['防御率(7回)','ERA7',true]];
function makeTable(id,cols,rows,isPitch){const t=$(id);t.replaceChildren();const tr=t.createTHead().insertRow();cols.forEach(c=>{const th=document.createElement('th');th.textContent=c[0];tr.appendChild(th);});const body=t.createTBody();rows.forEach(({year,player,total})=>{const row=body.insertRow();if(total)row.className='total';cols.forEach(c=>{const td=row.insertCell();if(c[1]==='year'){td.textContent=year;return;}const obj=isPitch?player?.pitching:player;const val=obj?.[c[1]];td.textContent=c[2]===true?fmt(val):(val??'---');});});}
async function request(scope,value){const u=new URL(STATS_API_URL);u.searchParams.set('scope',scope);if(value)u.searchParams.set('value',value);const res=await fetch(u);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!data.ok)throw Error(data.error||'取得失敗');return data;}
async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id||!/^P[0-9]+$/.test(id))throw Error('選手IDが指定されていません');const all=await request('all','');const player=all.players.find(p=>p.id===id);if(!player)throw Error('該当する選手が見つかりません');const num=player.number===null||player.number===undefined?'':`背番号 ${player.number}　`;$('playerTitle').textContent=num+player.name+'｜個人成績';document.title=player.name+'｜選手別成績｜野澤の足跡';const years=all.years||[];const yearData=await Promise.all(years.map(y=>request('year',y)));const rows=years.map((y,i)=>({year:y+'年',player:yearData[i].players.find(p=>p.id===id),total:false}));rows.push({year:'通算',player,total:true});makeTable('bat',battingCols,rows,false);if(rows.some(r=>Number(r.player?.pitching?.G)>0)){$('pitchSection').hidden=false;makeTable('pit',pitchingCols,rows,true);}else $('pitchSection').hidden=true;$('status').textContent=`${player.name} / 対象年度 ${years.length}件 / 通算対象試合 ${all.gameCount}件`;$('status').className='muted';}catch(err){$('status').textContent='成績を取得できません: '+err.message;$('status').className='muted error';console.error(err);}}
load();
</script></body></html>
