<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人成績｜野澤の足跡</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif;background:#f3f4f6;color:#171717}header{background:#111;color:#fff;text-align:center;padding:30px 16px}header a{color:#bbb;text-decoration:none;font-size:13px}header h1{margin:12px 0 0;font-size:24px}main{max-width:1150px;margin:auto;padding:28px 15px 70px}.card{background:#fff;border-radius:13px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px #0000000d}h2{font-size:18px;margin:0 0 15px;border-left:5px solid #222;padding-left:10px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{padding:10px;border:1px solid #cbd5d1;border-radius:7px;background:white}button{background:#174b3b;color:#fff;border:0;cursor:pointer}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th,td{border-bottom:1px solid #e1e5e2;padding:10px 9px;text-align:right}th{background:#eaf0ec}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}th:first-child{background:#eaf0ec}.muted{font-size:12px;color:#666;line-height:1.8}.error{color:#a22}footer{text-align:center;color:#888;font-size:12px;padding:25px}</style></head><body>
<header><a href="index.html">← 野澤の足跡に戻る</a><h1>個人成績</h1></header>
<main><section class="card"><h2>集計範囲</h2><div class="controls"><label for="scope">期間</label><select id="scope"><option value="all">通算</option><option value="year">年度別</option></select><label for="year" id="yearLabel" hidden>年度</label><select id="year" hidden></select><button id="reload">集計する</button></div><p class="muted" id="status">読み込み中……</p><p class="muted">年度は1月〜12月。得点は暫定値。「その他」の打席は集計対象外です。</p></section>
<section class="card"><h2>打撃・走塁成績</h2><div class="scroll"><table id="bat"></table></div></section>
<section class="card"><h2>投手成績</h2><div class="scroll"><table id="pit"></table></div></section></main><footer>© 野澤ナイン</footer>
<script>
// 公開用成績APIをデプロイした後、下の文字列を実際の /exec URLに変更する。
const STATS_API_URL='https://script.google.com/macros/s/AKfycbywwCt64Kf-1AsbwuSbkH0Ch04REDeoViQ4C7vWLHPQHQ60QM4L5_2387irVW_sOlLMMQ/exec';
const $=id=>document.getElementById(id);
const fmt=n=>n===null||n===undefined?'---':Number(n).toFixed(3);
function table(id,heads,rows){const t=$(id);t.replaceChildren();const thead=t.createTHead(),tr=thead.insertRow();heads.forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.appendChild(th)});const body=t.createTBody();rows.forEach(cells=>{const row=body.insertRow();cells.forEach(v=>{const td=row.insertCell();td.textContent=String(v??'');})});}
function render(data){$('status').textContent=`対象試合 ${data.gameCount}件 / 選手 ${data.players.length}人`;
  table('bat',['選手','PA','AB','H','2B','3B','HR','RBI','R*','BB','HBP','SO','SH','SF','AVG','OBP','SLG','OPS','SB','CS','盗塁率'],data.players.map(p=>[p.name,p.PA,p.AB,p.H,p.doubles,p.triples,p.HR,p.RBI,p.R,p.BB,p.HBP,p.SO,p.SH,p.SF,fmt(p.AVG),fmt(p.OBP),fmt(p.SLG),fmt(p.OPS),p.SB,p.CS,fmt(p.stealRate)]));
  table('pit',['選手','登板','IP','BF','H','HR','BB','HBP','SO','WP','BK','R','ER','ERA9','ERA7'],data.players.map(p=>{const s=p.pitching;return[p.name,s.G,s.IP,s.BF,s.H,s.HR,s.BB,s.HBP,s.SO,s.WP,s.BK,s.R,s.ER,fmt(s.ERA9),fmt(s.ERA7)]}));
}
async function load(){try{if(STATS_API_URL.startsWith('PASTE_'))throw Error('公開用成績APIのURLが未設定です');$('status').textContent='集計中……';const scope=$('scope').value,value=scope==='year'?$('year').value:'';const u=new URL(STATS_API_URL);u.searchParams.set('scope',scope);if(value)u.searchParams.set('value',value);const response=await fetch(u);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!data.ok)throw Error(data.error||'取得失敗');if(!$('year').options.length){data.years.forEach(y=>{const opt=document.createElement('option');opt.value=y;opt.textContent=y+'年';$('year').appendChild(opt)})}render(data)}catch(err){$('status').textContent='成績を取得できません: '+err.message;$('status').className='muted error';console.error(err)}}
$('scope').addEventListener('change',()=>{const show=$('scope').value==='year';$('year').hidden=!show;$('yearLabel').hidden=!show});$('reload').addEventListener('click',load);load();
</script></body></html>
